name: Cypress API Tests

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]
  workflow_dispatch:

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 1234
          POSTGRES_DB: meu_produto_app
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar Dependências e Preparar Banco
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/meu_produto_app?schema=public"
        run: |
          npm install
          npx prisma generate
          echo "--- Sincronizando banco com Prisma DB Push ---"
          npx prisma db push --skip-generate
          echo "--- Banco preparado ---"

      - name: Subir API em Background
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/meu_produto_app?schema=public"
          JWT_SECRET: "sua_secret_de_teste"
        run: |
          npm run start &
          npx wait-on http://localhost:3000/ --timeout 90000 

      - name: Rodar Testes do Cypress
        env:
          DATABASE_URL: "postgresql://postgres:1234@localhost:5432/meu_produto_app?schema=public"
        run: npm run cypress:run

      - name: Upload de Relatórios (Cypress)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-reports
          path: cypress/reports/html/
